# ============================================================
# AFAC2026 项目配置
# 所有路径均相对于项目根目录；可在 .env 中覆盖关键项。
# ============================================================

# ---- 模型配置（阿里云百炼 DashScope） ----
model:
  name: "qwen3.7-plus"      # 主模型（分析/压缩/作答共用）
  temperature: 0.1
  max_tokens: 4096

# ---- 数据路径 ----
data:
  chunks_file: "data/chunks/all_chunks.json"
  doc_registry: "data/doc_registry.json"
  questions_b_dir: "data/upload_b/question_b"
  submit_template: "data/upload_b/submit.csv"

# ---- 检索配置（BM25，Agent 实际使用路径） ----
retrieval:
  bm25:
    index_dir: "data/index"
    index_file: "bm25_index.pkl"
    top_k: 3               # 每轮每个检索目标召回条数
    fallback_k: 5          # 首轮未命中时扩大召回的条数

# ---- Agent 配置 ----
agent:
  batch_size: 5            # 批量运行时的并发线程数
  save_evidence: true

# ---- 输出目录 ----
output:
  dir: "output"
  evidence_dir: "output/evidence"
  logs_dir: "output/logs"
